# Render Blueprint for QuoteDesk: one web service plus one Postgres database.
# MCP_TOKEN is asked for in the Render dashboard (sync: false) because it becomes part of the
# connector URL and must be URL-safe. SESSION_SECRET is generated by Render.
databases:
  - name: quotedesk-db
    plan: free
    region: singapore
    databaseName: quotedesk

services:
  - type: web
    name: quotedesk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: quotedesk-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: MCP_TOKEN
        sync: false
